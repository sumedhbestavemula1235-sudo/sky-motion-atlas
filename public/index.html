<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Moved? — Motion Atlas</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1013;color:#edf5ed;font:16px/1.55 "DM Sans",system-ui,sans-serif}header,main{max-width:1440px;margin:auto;padding:24px 6%}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #34403b}a{color:inherit;text-decoration:none}header b{letter-spacing:-1px;font-size:22px}header b i{color:#bcf987;margin-right:10px}nav{display:flex;gap:25px}main{padding-top:6vh;padding-bottom:7vh}.hero{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:5%;min-height:65vh}h1,h2,h3,p{margin:0}h1{font-size:clamp(55px,6.4vw,103px);letter-spacing:-.075em;line-height:.98;margin:20px 0}em{font-family:Georgia,serif;font-weight:400;color:#c7f6a1}p{color:#adbbb6;max-width:38em;margin:18px 0}small,label{font:12px/1.6 monospace;letter-spacing:1.3px;color:#afc4b6}.cta,button{border:1px solid #475a53;border-radius:9px;padding:10px 17px;background:#192521;color:#edf5ed;cursor:pointer;font:inherit}.cta{display:inline-block;background:#c6f69e;color:#152019;font-weight:700;padding:13px 24px;margin-top:10px}.scope,.card{border:1px solid #394740;background:#101a1b;border-radius:18px;overflow:hidden}.scope{box-shadow:0 24px 80px #0005}.strip{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;gap:8px}.strip button{font-size:14px}canvas{display:block;width:100%;height:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{display:block;padding-bottom:16px;transition:transform .2s}.card:hover{transform:translateY(-5px);border-color:#b3d09d}.card h3,.card small,.card p{margin:12px 20px;display:block}.card h3{font-size:25px;letter-spacing:-1px}.card p{font-size:15px}.card canvas{border-bottom:1px solid #35403b}h2{font-size:clamp(36px,4vw,66px);letter-spacing:-.06em}section>p{margin-top:6px}.viewer{max-width:850px;margin:auto}.viewer input{width:100%;accent-color:#c6f69e}.viewer label{display:block;padding:14px 20px}.link{color:#c6f69e;text-decoration:underline}a:focus-visible,button:focus-visible{outline:3px solid #e9e294}@media(max-width:800px){.hero,.cards{grid-template-columns:1fr}.hero{gap:28px}main{padding-top:22px}nav{gap:12px}.strip{padding:12px}.card canvas{max-height:160px}.hero h1{font-size:64px}}
</style><link rel="stylesheet" href="guide.css"><header><a href="#home"><b><i>✶</i>What Moved?</b></a><nav><a href="#home">Overview</a><a href="#explore">Explore ↗</a></nav></header><main id="app"></main><script>
const objects=[["3I/ATLAS","Interstellar comet","Largest shift in this demo","Follow a sweeping arc through the field."],["Barnard’s Star","Nearby star","Subtle motion","Compare a tiny displacement against fixed neighbors."],["R Draconis","Variable star","Brightness change","Watch a star pulse while its position holds steady."]];
let index=0,t=0,playing=true,last=0,page='',revealed=false;
const app=document.querySelector('#app');const scenes=['A comet crosses','A nearby star drifts','A variable star brightens'];
function paint(c,i,p,mark=false){const g=c.getContext('2d'),w=c.width,h=c.height;g.fillStyle='#081417';g.fillRect(0,0,w,h);let seed=182;function rand(){seed=seed*16807%2147483647;return seed/2147483647}const tint=['#86e9c7','#accaff','#ffb482'][i];let x=w*(i===0?.25+.55*p:i===1?.54+.035*p:.55),y=h*(i===0?.63-.31*p:i===1?.47-.04*p:.48);let fog=g.createRadialGradient(x,y,0,x,y,w*.55);fog.addColorStop(0,tint+'28');fog.addColorStop(1,'transparent');g.fillStyle=fog;g.fillRect(0,0,w,h);for(let k=0;k<235;k++){let a=rand()*w,b=rand()*h,r=rand();g.fillStyle='rgba(223,244,239,'+(.18+.75*r)+')';g.fillRect(a,b,1+r,1+r)}if(i===0){g.save();g.translate(x,y);g.rotate(-.38);for(let k=0;k<95;k++){let f=rand(),tail=g.createLinearGradient(-w*.34,0,0,0);tail.addColorStop(0,'transparent');tail.addColorStop(1,'#96ffe519');g.strokeStyle=tail;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-w*.13,h*.03*f,-w*(.17+.23*rand()),h*(f-.33)*.27);g.stroke()}g.restore()}let r=i===2?13+15*p:12;let glow=g.createRadialGradient(x,y,0,x,y,r*3);glow.addColorStop(0,'white');glow.addColorStop(.08,tint);glow.addColorStop(.24,tint+'88');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.fillRect(x-r*3,y-r*3,r*6,r*6);if(mark){g.strokeStyle='#c6f69e';g.beginPath();g.arc(x,y,22,0,Math.PI*2);g.stroke()}}
function canvas(w=760,h=470){return '<canvas width="'+w+'" height="'+h+'" aria-label="Illustrated sky field"></canvas>'}
function route(){page=location.hash.slice(1)||'home';if(!['home','explore','0','1','2'].includes(page))page='home';t=0;revealed=false;playing=page==='home'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;index=page==='home'||page==='explore'?0:Number(page);
if(page==='home')app.innerHTML='<div class="hero"><article><small>SPHEREx • MOTION ATLAS</small><h1>The sky<br>in <em>motion.</em></h1><p>A comet sweeps past. A star shifts. Another flickers in place. Choose a field and see what changes between views.</p><a class="cta" href="#explore">Explore the sky &nbsp; ↗</a></article><div class="scope"><div class="strip"><small>ANIMATED FIELD STUDY</small><small>ILLUSTRATION</small></div>'+canvas()+'<div class="strip"><strong id="caption"></strong><div><button id="play"></button> <button id="next" aria-label="Next scene">→</button></div></div></div></div>';
else if(page==='explore'){app.innerHTML='<section><small>MOTION ATLAS</small><h2>Choose a field.</h2><p>Start with the comet for the clearest movement in these simulated previews.</p><div class="cards">'+objects.map((o,i)=>'<a class="card" href="#'+i+'">'+canvas(480,250)+'<small>'+o[2].toUpperCase()+'</small><h3>'+o[0]+' ↗</h3><p>'+o[3]+'</p></a>').join('')+'</div></section>';app.querySelectorAll('canvas').forEach((c,i)=>paint(c,i,.6));return}
else app.innerHTML='<section class="viewer"><a class="link" href="#explore">← All fields</a><h2>'+objects[index][0]+'</h2><p>'+objects[index][3]+'</p><div class="scope"><div class="strip"><small>'+objects[index][1].toUpperCase()+'</small><small>SIMULATED PREVIEW</small></div>'+canvas()+'<label>TIME SLIDER <input id="time" type="range" min="0" max="100" value="0"></label><div class="strip"><button id="play"></button><button id="mark">Show target</button></div></div>'+(index===1?'<p><a class="link" href="practice.html">Play the two-date practice round ↗</a></p>':'')+'</section>';
document.querySelector('#play').onclick=()=>{playing=!playing;sync()};if(page==='home')document.querySelector('#next').onclick=()=>{index=(index+1)%3;t=0;sync()};else{document.querySelector('#time').oninput=e=>{playing=false;t=e.target.value/100;sync()};document.querySelector('#mark').onclick=e=>{revealed=!revealed;e.target.textContent=revealed?'Hide target':'Show target';sync()}}sync()}
function sync(){document.querySelector('#play').textContent=playing?'Ⅱ Pause':'▶ Play';if(page==='home')document.querySelector('#caption').textContent=scenes[index];else document.querySelector('#time').value=Math.round(t*100);paint(app.querySelector('canvas'),index,t,revealed)}
function tick(now){if(playing&&page!=='explore'&&now-last>40){t+=Math.min(now-last,120)/6500;if(t>=1){t=0;if(page==='home')index=(index+1)%3}last=now;sync()}requestAnimationFrame(tick)}onhashchange=()=>{route();scrollTo(0,0)};route();requestAnimationFrame(tick)
</script>
